<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP &amp; Komersial — DataUPIK POLISAS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-layout">
  <div id="sidebar-placeholder"></div>
  <div class="main-content">
    <div class="top-navbar">
      <button class="hamburger" onclick="toggleSidebar()"><span></span><span></span><span></span></button>
      <div class="navbar-title">🏛️ Harta Intelek (IP) &amp; Pengkomersialan</div>
      <div class="nav-user-info" id="nav-user-info"></div>
    </div>
    <div id="search-bar-placeholder"></div>
    <div class="page-content">
      <div class="page-header">
        <div>
          <div class="page-title">Data IP &amp; Komersial</div>
          <div class="page-subtitle" id="record-count-label">Memuatkan...</div>
        </div>
        <div class="d-flex gap-2" style="flex-wrap:wrap">
          <button class="btn btn-secondary btn-sm" onclick="printStatistik()">🖨️ Print</button>
          <button class="btn btn-success btn-sm" id="btn-export" onclick="doExport()">📥 Export Excel</button>
          <button class="btn btn-primary btn-sm" id="btn-tambah" onclick="openAddModal()">➕ Tambah Data</button>
        </div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-type="" onclick="setTypeFilter(this,'')">Semua</button>
        <button class="tab-btn" data-type="Copyright" onclick="setTypeFilter(this,'Copyright')">Copyright</button>
        <button class="tab-btn" data-type="Trademark" onclick="setTypeFilter(this,'Trademark')">Trademark</button>
        <button class="tab-btn" data-type="Industrial Design" onclick="setTypeFilter(this,'Industrial Design')">Rekabentuk Industri</button>
        <button class="tab-btn" data-type="Patent" onclick="setTypeFilter(this,'Patent')">Patent</button>
      </div>

      <div class="table-card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>UID</th>
                <th>Ketua</th>
                <th>Tajuk</th>
                <th>No. IP</th>
                <th>Tarikh Daftar</th>
                <th>Jenis IP</th>
                <th>Komersial?</th>
                <th>Nilai (RM)</th>
                <th>Jabatan</th>
                <th>Tahun</th>
              </tr>
            </thead>
            <tbody id="data-tbody">
              <tr><td colspan="10"><div class="loading-spinner"><div class="spinner"></div> Memuatkan data...</div></td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination">
          <div class="pagination-info" id="data-info"></div>
          <div class="pagination-btns" id="data-pagination"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Detail Drawer -->
<div class="drawer-overlay" id="detail-overlay" onclick="closeDrawer('detail')"></div>
<div class="drawer" id="detail">
  <div class="drawer-header">
    <div class="drawer-title">🏛️ Detail IP &amp; Komersial</div>
    <button class="drawer-close" onclick="closeDrawer('detail')">✕</button>
  </div>
  <div class="drawer-body" id="detail-body"></div>
  <div class="drawer-footer" id="detail-footer"></div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modal-form">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-form-title">Tambah Data IP</div>
      <button class="modal-close" onclick="closeModal('modal-form')">✕</button>
    </div>
    <div class="modal-body">
      <div id="modal-alert" class="alert alert-danger"></div>
      <div id="form-fields"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-form')">Batal</button>
      <button class="btn btn-primary" id="btn-save" onclick="saveData()">Simpan</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
const user = initPage('ip');
let allData = [], paginator, editingUid = null, typeFilter = '';

if (user) {
  document.getElementById('sidebar-placeholder').innerHTML = sidebarHTML('ip');
  document.getElementById('search-bar-placeholder').innerHTML = searchBarHTML('ip');
  populateYearFilter('filter-year'); populateJabatanFilter('filter-jabatan'); populateSdgFilter('filter-sdg');
  if (user.role !== 'admin') {
    document.getElementById('btn-export').style.display = 'none';
    document.getElementById('btn-tambah').textContent = '➕ Hantar Data';
  }
  loadData();
}

async function loadData() {
  const { data, error } = await supabaseClient.from(TABLES.ip).select('*').order('Year', { ascending: false });
  if (error) { showToast('Ralat: ' + error.message, 'error'); return; }
  allData = data || [];
  document.getElementById('record-count-label').textContent = allData.length + ' rekod';
  paginator = new Paginator({ data: allData, pageSize: 15, renderFn: renderRows, containerId: 'data-tbody', paginationId: 'data-pagination', infoId: 'data-info' });
  applyFilters();
}

function renderRows(rows) {
  if (!rows.length) return '<tr><td colspan="10"><div class="empty-state"><div class="empty-state-icon">📭</div><div class="empty-state-text">Tiada rekod</div></div></td></tr>';
  return rows.map((r,i) => `
    <tr onclick="showDetail(${i + (paginator.page-1)*paginator.pageSize})">
      <td style="font-family:monospace;color:var(--muted);font-size:.78rem">${esc(r['UID'])}</td>
      <td>${esc(r['Team Leader'])}</td>
      <td title="${esc(r['Title Development / Innovation'])}">${esc(r['Title Development / Innovation'])}</td>
      <td style="font-size:.78rem">${esc(r['Intelectual Property (IP) Number']||'—')}</td>
      <td>${fmtDate(r['Date Register to MyIPO'])}</td>
      <td><span class="badge badge-inst">${esc(r['Type of IP']||'—')}</span></td>
      <td>${yesnoBadge(r['Commercialize'])}</td>
      <td>${fmtRm(r['Value (Nilai Perolehan)'])}</td>
      <td>${esc(r['Department'])}</td>
      <td>${esc(r['Year'])}</td>
    </tr>`).join('');
}

function showDetail(idx) {
  const r = paginator.filtered[idx]; if (!r) return;
  const isAdmin = user.role === 'admin';
  document.getElementById('detail-body').innerHTML = `
    ${dRow('UID', r['UID'])}
    ${dRow('Ketua', r['Team Leader'])}
    ${dRow('Ahli 1', r['Teams member 1'])} ${dRow('Ahli 2', r['Teams member 2'])}
    ${dRow('Ahli 3', r['Teams member 3'])} ${dRow('Ahli 4', r['Teams member 4'])} ${dRow('Ahli 5', r['Teams member 5'])}
    ${dRow('Tajuk', r['Title Development / Innovation'])}
    ${dRow('No. IP', r['Intelectual Property (IP) Number'])}
    ${dRow('Tarikh Daftar MyIPO', fmtDate(r['Date Register to MyIPO']))}
    ${dRow('Jenis IP', r['Type of IP'])}
    ${dRow('Tajuk Konsultansi', r['Consultancy Title'])}
    ${dRow('Nama Geran', r['Grant name'])}
    ${dRow('Industri / Institusi', r['Industry or institutions involved in research & development'])}
    ${dRow('Tarikh Siap', fmtDate(r['Date of Completion']))}
    ${dRow('Dikomersilkan?', yesnoBadge(r['Commercialize']))}
    ${dRow('Jabatan', r['Department'])}
    ${dRow('Tahun', r['Year'])}
    ${dRow('Nilai Perolehan', fmtRm(r['Value (Nilai Perolehan)']))}
    ${dRow('Catatan', r['Remarks'])}
  `;
  const footer = document.getElementById('detail-footer');
  if (isAdmin) {
    footer.innerHTML = `
      <button class="btn btn-info btn-sm" onclick="downloadFile('data-upik-storage','${esc(r['File(Receipt)'])}','Receipt')">🧾 Receipt</button>
      <button class="btn btn-info btn-sm" onclick="downloadFile('data-upik-storage','${esc(r['File (Certificate)'])}','Certificate')">📜 Sijil</button>
      <button class="btn btn-info btn-sm" onclick="downloadFile('data-upik-storage','${esc(r['File (documents register)'])}','Dokumen')">📄 Dokumen</button>
      <button class="btn btn-secondary btn-sm" onclick="openEditModal('${esc(r['UID'])}')">✏️ Kemaskini</button>
      <button class="btn btn-danger btn-sm" onclick="deleteRecord('${esc(r['UID'])}')">🗑️ Padam</button>
    `;
  } else { footer.innerHTML = ''; }
  openDrawer('detail');
}

function dRow(label, val) {
  return `<div class="detail-row"><div class="detail-label">${label}</div><div class="detail-value">${val||'—'}</div></div>`;
}

function setTypeFilter(btn, type) {
  typeFilter = type;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function applyFilters() {
  if (!paginator) return;
  const search  = (document.getElementById('global-search')?.value||'').toLowerCase();
  const year    = document.getElementById('filter-year')?.value||'';
  const jabatan = document.getElementById('filter-jabatan')?.value||'';
  paginator.filter(r => {
    const matchType   = !typeFilter || (r['Type of IP']||'') === typeFilter;
    const matchYear   = !year    || String(r['Year']) === year;
    const matchJabatan= !jabatan || r['Department'] === jabatan;
    const matchSearch = !search  || JSON.stringify(r).toLowerCase().includes(search);
    return matchType && matchYear && matchJabatan && matchSearch;
  });
}

function openAddModal() {
  editingUid = null;
  document.getElementById('modal-form-title').textContent = user.role === 'admin' ? 'Tambah Data IP' : 'Hantar Data IP';
  document.getElementById('modal-alert').classList.remove('show');
  document.getElementById('form-fields').innerHTML = buildForm(null);
  openModal('modal-form');
}
function openEditModal(uid) {
  const r = allData.find(x => x['UID'] === uid); if (!r) return;
  editingUid = uid;
  document.getElementById('modal-form-title').textContent = 'Kemaskini Data IP';
  document.getElementById('modal-alert').classList.remove('show');
  document.getElementById('form-fields').innerHTML = buildForm(r);
  closeDrawer('detail'); openModal('modal-form');
}

function buildForm(r) {
  const v = k => r ? esc(r[k]||'') : '';
  const jabOpts = JABATAN_LIST.map(j=>`<option value="${j.kod}" ${v('Department')===j.kod?'selected':''}>${j.kod} — ${j.nama}</option>`).join('');
  const yrOpts  = getYearList().map(y=>`<option value="${y}" ${v('Year')==String(y)?'selected':''}>${y}</option>`).join('');
  const ipOpts  = ['Copyright','Trademark','Industrial Design','Patent','Utility Innovation'].map(t=>`<option value="${t}" ${v('Type of IP')===t?'selected':''}>${t}</option>`).join('');
  return `
    <div class="form-group"><label class="form-label">Tajuk *</label><input class="form-control" id="f-title" value="${v('Title Development / Innovation')}"></div>
    <div class="form-group"><label class="form-label">Ketua *</label><input class="form-control" id="f-leader" value="${v('Team Leader')}"></div>
    <div class="form-group"><label class="form-label">Ahli 1</label><input class="form-control" id="f-m1" value="${v('Teams member 1')}"></div>
    <div class="form-group"><label class="form-label">Ahli 2</label><input class="form-control" id="f-m2" value="${v('Teams member 2')}"></div>
    <div class="form-group"><label class="form-label">Ahli 3</label><input class="form-control" id="f-m3" value="${v('Teams member 3')}"></div>
    <div class="form-group"><label class="form-label">No. IP</label><input class="form-control" id="f-ip" value="${v('Intelectual Property (IP) Number')}"></div>
    <div class="form-group"><label class="form-label">Tarikh Daftar MyIPO</label><input class="form-control" id="f-date" type="date" value="${v('Date Register to MyIPO')}"></div>
    <div class="form-group"><label class="form-label">Jenis IP</label><select class="form-control" id="f-type"><option value="">--Pilih--</option>${ipOpts}</select></div>
    <div class="form-group"><label class="form-label">Tajuk Konsultansi</label><input class="form-control" id="f-consult" value="${v('Consultancy Title')}"></div>
    <div class="form-group"><label class="form-label">Nama Geran</label><input class="form-control" id="f-grant" value="${v('Grant name')}"></div>
    <div class="form-group"><label class="form-label">Industri / Institusi</label><input class="form-control" id="f-ind" value="${v('Industry or institutions involved in research & development')}"></div>
    <div class="form-group"><label class="form-label">Tarikh Siap</label><input class="form-control" id="f-comp" type="date" value="${v('Date of Completion')}"></div>
    <div class="form-group"><label class="form-label">Dikomersilkan?</label>
      <select class="form-control" id="f-comm"><option value="FALSE">Tidak</option><option value="TRUE" ${v('Commercialize')==='TRUE'?'selected':''}>Ya</option></select></div>
    <div class="form-group"><label class="form-label">Nilai Perolehan (RM)</label><input class="form-control" id="f-value" type="number" value="${v('Value (Nilai Perolehan)')}"></div>
    <div class="form-group"><label class="form-label">Jabatan *</label><select class="form-control" id="f-dept"><option value="">--Pilih--</option>${jabOpts}</select></div>
    <div class="form-group"><label class="form-label">Tahun *</label><select class="form-control" id="f-year"><option value="">--Pilih--</option>${yrOpts}</select></div>
    <div class="form-group"><label class="form-label">Catatan</label><textarea class="form-control" id="f-remarks" rows="2">${v('Remarks')}</textarea></div>
  `;
}

async function saveData() {
  const title = document.getElementById('f-title').value.trim();
  const leader= document.getElementById('f-leader').value.trim();
  const dept  = document.getElementById('f-dept').value;
  const year  = document.getElementById('f-year').value;
  if (!title || !leader || !dept || !year) {
    document.getElementById('modal-alert').textContent = 'Sila isi maklumat yang bertanda *.';
    document.getElementById('modal-alert').classList.add('show'); return;
  }
  const payload = {
    'Title Development / Innovation': title, 'Team Leader': leader,
    'Teams member 1': document.getElementById('f-m1').value,
    'Teams member 2': document.getElementById('f-m2').value,
    'Teams member 3': document.getElementById('f-m3').value,
    'Intelectual Property (IP) Number': document.getElementById('f-ip').value,
    'Date Register to MyIPO': document.getElementById('f-date').value,
    'Type of IP': document.getElementById('f-type').value,
    'Consultancy Title': document.getElementById('f-consult').value,
    'Grant name': document.getElementById('f-grant').value,
    'Industry or institutions involved in research & development': document.getElementById('f-ind').value,
    'Date of Completion': document.getElementById('f-comp').value,
    'Commercialize': document.getElementById('f-comm').value,
    'Value (Nilai Perolehan)': document.getElementById('f-value').value,
    'Department': dept, 'Year': year,
    'Remarks': document.getElementById('f-remarks').value,
  };
  const btn = document.getElementById('btn-save'); btn.disabled = true; btn.textContent = 'Menyimpan…';
  let error;
  if (editingUid) {
    ({ error } = await supabaseClient.from(TABLES.ip).update(payload).eq('UID', editingUid));
  } else {
    payload['UID'] = 'K' + Date.now();
    if (user.role !== 'admin') payload['status'] = 'pending';
    ({ error } = await supabaseClient.from(TABLES.ip).insert([payload]));
  }
  btn.disabled = false; btn.textContent = 'Simpan';
  if (error) { document.getElementById('modal-alert').textContent = error.message; document.getElementById('modal-alert').classList.add('show'); return; }
  closeModal('modal-form'); showToast('Data berjaya disimpan!', 'success'); loadData();
}

async function deleteRecord(uid) {
  if (!confirm('Padam rekod ini?')) return;
  const { error } = await supabaseClient.from(TABLES.ip).delete().eq('UID', uid);
  if (error) { showToast('Ralat: ' + error.message, 'error'); return; }
  closeDrawer('detail'); showToast('Rekod dipadam.', 'success'); loadData();
}

function doExport() {
  if (user.role !== 'admin') { showToast('Hanya admin.', 'error'); return; }
  exportExcel(paginator.filtered, 'DataUPIK_IP_Komersial');
}
</script>
</body>
</html>
